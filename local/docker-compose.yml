# REVISADO (v2) — mudanças vs. o original do repo:
#   1) analytics-service DEScomentado e corrigido (env certa: AWS_DYNAMODB_TABLE;
#      e o requirements.txt dele foi corrigido — sem isso o container morria
#      no import de boto3, motivo pelo qual estava comentado)
#   2) dynamodb-local adicionado (requisito: 9 containers = 5 apps + 4 DBs)
#   3) Passthrough de credenciais AWS pro evaluation e analytics:
#      - SQS não tem emulador local exigido no enunciado -> a fila usada é a REAL.
#      - Antes de "docker compose up", exporte as credenciais do Academy:
#            export AWS_ACCESS_KEY_ID=...
#            export AWS_SECRET_ACCESS_KEY=...
#            export AWS_SESSION_TOKEN=...
#            export AWS_SQS_URL=https://sqs.us-east-1.amazonaws.com/242686594219/techchallenger-evaluation-events
#      - Sem exportar, os defaults "test" entram: os 9 containers SOBEM
#        normalmente (o que o vídeo exige), o DynamoDB local funciona
#        (aceita credencial fake), e apenas a comunicação com a fila real
#        loga erro — comportamento honesto e demonstrável.
#   4) Para o fluxo local completo do analytics, crie a tabela no DynamoDB
#      local uma vez (após o up):
#        aws dynamodb create-table --endpoint-url http://localhost:8600 \
#          --table-name ToggleMasterAnalytics \
#          --attribute-definitions AttributeName=event_id,AttributeType=S \
#          --key-schema AttributeName=event_id,KeyType=HASH \
#          --billing-mode PAY_PER_REQUEST --region us-east-1

services:
  # ---------- DATABASES ----------
  auth-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
      POSTGRES_DB: auth_db
    volumes:
      - auth_pg:/var/lib/postgresql/data
      - ./auth-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql

  flags-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: flags_user
      POSTGRES_PASSWORD: flags_pass
      POSTGRES_DB: flags_db
    volumes:
      - flags_pg:/var/lib/postgresql/data
      - ./flag-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql

  targeting-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: targeting_user
      POSTGRES_PASSWORD: targeting_pass
      POSTGRES_DB: targeting_db
    volumes:
      - targeting_pg:/var/lib/postgresql/data
      - ./targeting-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    ports:
      - "8600:8000"

  # ---------- SERVICES ----------
  auth-service:
    build: ./auth-service
    environment:
      DATABASE_URL: postgres://auth_user:auth_pass@auth-postgres:5432/auth_db
      PORT: 8001
      MASTER_KEY: admin-secreto-123
    ports:
      - "8001:8001"
    depends_on:
      - auth-postgres

  flag-service:
    build: ./flag-service
    environment:
      DATABASE_URL: postgres://flags_user:flags_pass@flags-postgres:5432/flags_db
      PORT: 8002
      AUTH_SERVICE_URL: http://auth-service:8001
    ports:
      - "8002:8002"
    depends_on:
      - flags-postgres
      - auth-service

  targeting-service:
    build: ./targeting-service
    environment:
      DATABASE_URL: postgres://targeting_user:targeting_pass@targeting-postgres:5432/targeting_db
      PORT: 8003
      AUTH_SERVICE_URL: http://auth-service:8001
    ports:
      - "8003:8003"
    depends_on:
      - targeting-postgres
      - auth-service

  evaluation-service:
    build: ./evaluation-service
    environment:
      PORT: 8004
      REDIS_URL: redis://redis:6379
      FLAG_SERVICE_URL: http://flag-service:8002
      TARGETING_SERVICE_URL: http://targeting-service:8003
      AUTH_SERVICE_URL: http://auth-service:8001
      SERVICE_API_KEY: master-key-9c1f2b7e4a6d8e3f5c0a1b2d4e6f8a9c
      AWS_REGION: us-east-1
      AWS_SQS_URL: ${AWS_SQS_URL:-URL_SQS}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    ports:
      - "8004:8004"
    depends_on:
      - redis
      - flag-service
      - targeting-service

  analytics-service:
    build: ./analytics-service
    environment:
      PORT: 8005
      AWS_REGION: us-east-1
      AWS_SQS_URL: ${AWS_SQS_URL:-URL_SQS}
      AWS_DYNAMODB_TABLE: ToggleMasterAnalytics
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb-local:8000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    ports:
      - "8005:8005"
    depends_on:
      - dynamodb-local

volumes:
  auth_pg:
  flags_pg:
  targeting_pg:
