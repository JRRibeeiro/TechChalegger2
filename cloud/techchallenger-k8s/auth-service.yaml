# REVISADO — adiciona ConfigMap/Secret, requests/limits, probes.
# DATABASE_URL/MASTER_KEY antes viviam soltos em texto puro no Deployment.
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: techchallenger
type: Opaque
stringData:
  DATABASE_URL: "postgres://auth_user:auth_pass_123@auth-postgres.cngcg0y0s735.us-east-1.rds.amazonaws.com:5432/auth_db"
  MASTER_KEY: "admin-secreto-123"   # troque por algo forte antes da gravação do vídeo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: techchallenger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: docker.io/robertoribeiroo/auth-service:latest
          ports:
            - containerPort: 8001
          env:
            - name: PORT
              value: "8001"
          envFrom:
            - secretRef:
                name: auth-service-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: techchallenger
spec:
  selector:
    app: auth-service
  ports:
    - port: 8001
      targetPort: 8001
