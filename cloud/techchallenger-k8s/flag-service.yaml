apiVersion: v1
kind: ConfigMap
metadata:
  name: flag-service-config
  namespace: techchallenger
data:
  PORT: "8002"
  AUTH_SERVICE_URL: "http://auth-service:8001"
---
apiVersion: v1
kind: Secret
metadata:
  name: flag-service-secret
  namespace: techchallenger
type: Opaque
stringData:
  DATABASE_URL: "postgres://flags_user:flags_pass_123@flags-db.cngcg0y0s735.us-east-1.rds.amazonaws.com:5432/flags_db"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-service
  namespace: techchallenger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flag-service
  template:
    metadata:
      labels:
        app: flag-service
    spec:
      containers:
        - name: flag-service
          image: docker.io/robertoribeiroo/flag-service:latest
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: flag-service-config
            - secretRef:
                name: flag-service-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: flag-service
  namespace: techchallenger
spec:
  selector:
    app: flag-service
  ports:
    - port: 8002
      targetPort: 8002
