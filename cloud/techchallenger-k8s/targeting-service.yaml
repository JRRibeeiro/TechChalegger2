apiVersion: v1
kind: ConfigMap
metadata:
  name: targeting-service-config
  namespace: techchallenger
data:
  PORT: "8003"
  AUTH_SERVICE_URL: "http://auth-service:8001"
---
apiVersion: v1
kind: Secret
metadata:
  name: targeting-service-secret
  namespace: techchallenger
type: Opaque
stringData:
  DATABASE_URL: "postgres://targeting_user:targeting_password12345@techchallenger-targeting-db.cngcg0y0s735.us-east-1.rds.amazonaws.com:5432/targeting_db"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: targeting-service
  namespace: techchallenger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: targeting-service
  template:
    metadata:
      labels:
        app: targeting-service
    spec:
      containers:
        - name: targeting-service
          image: docker.io/robertoribeiroo/targeting-service:latest
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: targeting-service-config
            - secretRef:
                name: targeting-service-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: targeting-service
  namespace: techchallenger
spec:
  selector:
    app: targeting-service
  ports:
    - port: 8003
      targetPort: 8003
